<rect x="568" y="72" width="28" height="28" fill="#30272D"/><rect x="564" y="80" width="6" height="27" fill="#30272D"/><rect x="592" y="78" width="6" height="29" fill="#30272D"/><rect x="572" y="66" width="20" height="6" fill="#30272D"/>

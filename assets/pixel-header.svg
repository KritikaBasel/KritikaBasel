<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Cozy pastel pixel meadow</title><desc id="desc">A simple pastel pixel-art meadow with a small computer desk and a brown-skinned girl with long dark hair, a navy shirt, black trousers and white shoes.</desc>
<rect width="960" height="160" fill="#DCEEF5"/>
<!-- quiet clouds and soft sun -->
<g fill="#FFF5DF"><rect x="88" y="24" width="44" height="6"/><rect x="98" y="18" width="26" height="6"/><rect x="108" y="30" width="20" height="5"/><rect x="770" y="32" width="38" height="6"/><rect x="780" y="26" width="24" height="6"/></g>
<g fill="#F0D17D"><rect x="635" y="18" width="18" height="18"/><rect x="629" y="24" width="30" height="6"/><rect x="641" y="12" width="6" height="30"/></g>
<!-- gentle distant hill -->
<path d="M0 91H130V82H250V91H340V84H460V94H590V84H710V91H835V82H960V111H0Z" fill="#B9D9B6"/>
<!-- grass, deliberately quiet and uncluttered -->
<path d="M0 103H960V160H0Z" fill="#8ABD80"/>
<path d="M0 121H120V127H210V120H310V129H420V122H535V128H650V120H770V127H870V121H960V160H0Z" fill="#78AF70"/>
<path d="M0 145H180V151H340V144H480V151H635V145H790V151H960V160H0Z" fill="#5D965D"/>
<!-- just a few tiny grass marks -->
<g fill="#B6D69A"><rect x="58" y="118" width="4" height="8"/><rect x="66" y="122" width="4" height="4"/><rect x="262" y="133" width="4" height="8"/><rect x="270" y="137" width="4" height="4"/><rect x="830" y="119" width="4" height="8"/></g>
<!-- small flowers, with generous open space -->
<g><g transform="translate(170 124)"><rect x="7" y="11" width="4" height="18" fill="#4E8652"/><rect x="3" y="3" width="5" height="5" fill="#D99AA8"/><rect x="8" y="-2" width="5" height="5" fill="#D99AA8"/><rect x="13" y="3" width="5" height="5" fill="#D99AA8"/><rect x="8" y="8" width="5" height="5" fill="#D99AA8"/><rect x="8" y="3" width="5" height="5" fill="#F0D17D"/></g>
<g transform="translate(320 139)"><rect x="6" y="8" width="4" height="13" fill="#4E8652"/><rect x="2" y="2" width="4" height="4" fill="#B2A9D9"/><rect x="6" y="-2" width="4" height="4" fill="#B2A9D9"/><rect x="10" y="2" width="4" height="4" fill="#B2A9D9"/><rect x="6" y="6" width="4" height="4" fill="#F0D17D"/></g>
<g transform="translate(790 128)"><rect x="6" y="10" width="4" height="17" fill="#4E8652"/><rect x="2" y="2" width="4" height="4" fill="#D99AA8"/><rect x="6" y="-2" width="4" height="4" fill="#D99AA8"/><rect x="10" y="2" width="4" height="4" fill="#D99AA8"/><rect x="6" y="6" width="4" height="4" fill="#F0D17D"/></g>
<g transform="translate(895 139)"><rect x="5" y="8" width="4" height="13" fill="#4E8652"/><rect x="1" y="2" width="4" height="4" fill="#F0D17D"/><rect x="5" y="-2" width="4" height="4" fill="#F0D17D"/><rect x="9" y="2" width="4" height="4" fill="#F0D17D"/><rect x="5" y="6" width="4" height="4" fill="#D99AA8"/></g></g>
<!-- a single little butterfly -->
<g transform="translate(270 63)"><rect x="10" y="3" width="3" height="10" fill="#705343"/><rect x="2" y="0" width="8" height="6" fill="#D99AA8"/><rect x="4" y="6" width="6" height="5" fill="#F0D17D"/><rect x="13" y="0" width="8" height="6" fill="#D99AA8"/><rect x="13" y="6" width="6" height="5" fill="#F0D17D"/></g>
<!-- desk: small, soft, with the monitor as focal point -->
<g>
<rect x="418" y="111" width="112" height="6" fill="#79583F"/><rect x="426" y="117" width="6" height="27" fill="#9B7658"/><rect x="516" y="117" width="6" height="27" fill="#9B7658"/>
<rect x="430" y="117" width="86" height="17" fill="#B78B65"/><rect x="438" y="125" width="26" height="4" fill="#9B7658"/><rect x="473" y="125" width="25" height="4" fill="#9B7658"/>
<rect x="442" y="77" width="58" height="35" fill="#565267"/><rect x="447" y="82" width="48" height="25" fill="#BDE2EA"/><rect x="452" y="88" width="11" height="3" fill="#5B965D"/><rect x="467" y="88" width="20" height="3" fill="#B2A9D9"/><rect x="452" y="95" width="25" height="3" fill="#D99AA8"/><rect x="466" y="112" width="10" height="5" fill="#79583F"/>
<rect x="464" y="120" width="26" height="4" fill="#F7EEDD"/>

<!-- trousers, separated legs and gentle highlights -->
<rect x="572" y="121" width="9" height="20" fill="#252832"/><rect x="584" y="121" width="9" height="20" fill="#252832"/><rect x="576" y="124" width="2" height="12" fill="#353944"/><rect x="588" y="124" width="2" height="12" fill="#353944"/>
<!-- white trainers -->
<rect x="568" y="141" width="13" height="6" fill="#FFF9EF"/><rect x="584" y="141" width="13" height="6" fill="#FFF9EF"/><rect x="568" y="145" width="13" height="2" fill="#D6D9D7"/><rect x="584" y="145" width="13" height="2" fill="#D6D9D7"/>
</g>
</svg>